# dsh-providers-live-models — bundle patch: mount the host plugin under its
# package name, resolved through the profile's node_modules by
# `dsh plugin --profile <name> add dsh-providers-live-models`.
#
# The plugin reaches the running pi-ai instance through `ctx.llm.adapters`, a
# TypeScript-private field that is an ordinary Map at runtime, and imports
# no host packages at mount: the host can resolve them for a profile plugin, but this
# module must also load in a bare Node process for its test suite, where it
# cannot. See the module header.
- insert:
    - id: opencode-live-models
      name: dsh-providers-live-models
